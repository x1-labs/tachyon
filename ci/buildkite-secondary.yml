#
# Build steps that run after the primary pipeline on pushes and tags.
# Pull requests to not run these steps.
steps:
  - name: "cargo audit"
    command: "ci/docker-run-default-image.sh ci/do-audit.sh"
    agents:
      queue: "release-build"
    timeout_in_minutes: 10

  - name: "build the deb files"
    command: "ci/build-deb.sh"
    agents:
      queue: "release-build"
    timeout_in_minutes: 30

  - name: "publish the deb files"
    command: "ci/publish-deb.sh"
    agents:
      queue: "release-build"
    timeout_in_minutes: 10
